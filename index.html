<div id="app">

  <!-- ============ ФОН: НЕБО, ЗВЁЗДЫ, ОБЛАКА, ДАЛЬНИЙ ГОРОД ============ -->
  <div class="sky" aria-hidden="true">
    <div class="sky-glow g1"></div>
    <div class="sky-glow g2"></div>
    <div class="sky-glow g3"></div>
    <div id="stars"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="grid-lines"></div>
    <div id="farCity" class="far"></div>
  </div>

  <!-- ============ КАРТА МИРА ============ -->
  <main class="scroller" id="scroller">
    <div class="world" id="world">

      <div class="zone-glow z4"></div>
      <div class="zone-glow z3"></div>
      <div class="zone-glow z2"></div>
      <div class="zone-glow z1"></div>

      <svg class="route" id="route" aria-hidden="true"></svg>
      <div id="decor" aria-hidden="true"></div>

      <!-- Уровень 1 — Фишинг -->
      <div class="loc loc-1" data-i="0" role="button" tabindex="0">
        <div class="loc-in">
          <div class="loc-glow"></div>
          <div class="loc-bg"></div>
          <svg class="loc-art" viewBox="0 0 210 196" aria-hidden="true">
            <circle cx="92" cy="66" r="62" fill="#FFD84A" opacity=".24"/>

              <polygon points="58,40 92,6 126,40" fill="#E8384F"/>
            </g>
            <path d="M92 6V-14" stroke="#18213D" stroke-width="4" stroke-linecap="round"/>
            <path class="flag" d="M92-14h20l-5 6 5 6H92z" fill="#FFD84A" stroke="#18213D" stroke-width="3" stroke-linejoin="round"/>
            <rect x="74" y="50" width="14" height="16" rx="5" fill="#48AEFF" stroke="#18213D" stroke-width="3"/>
            <rect x="96" y="50" width="14" height="16" rx="5" fill="#48AEFF" stroke="#18213D" stroke-width="3"/>

            <path d="M160-16V58a13 13 0 0 1-26 0v-6" fill="none" stroke="#18213D" stroke-width="9" stroke-linecap="round"/>
            <path d="M160-16V58a13 13 0 0 1-26 0v-6" fill="none" stroke="#E6EEFF" stroke-width="4" stroke-linecap="round"/>
            <g class="bait" transform="translate(132 76) rotate(-6)">
              <rect width="60" height="24" rx="12" fill="#F04457" stroke="#18213D" stroke-width="3.5"/>
              <text x="30" y="17" text-anchor="middle" font-size="12.5" font-weight="900" fill="#fff">http://</text>
            </g>
            <use class="float-a" href="#s-mail" x="10" y="14" width="38" height="29" style="color:#E8384F"/>
            <use class="float-b" href="#s-virus" x="6" y="68" width="32" height="32" style="color:#F04457"/>
            <use href="#s-shield" x="174" y="2" width="26" height="31" style="color:#48AEFF"/>
            <use class="plane p1" href="#s-plane" x="120" y="-6" width="30" height="19"/>
          </svg>
          <div class="sparks"></div>
          <div class="lock-big"><svg viewBox="0 0 50 60"><use href="#s-lock"/></svg></div>
          <div class="prize"><svg viewBox="0 0 56 72"><use href="#s-medal"/></svg></div>
          <div class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-11" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="num">1</div>
          <div class="stars"></div>
          <div class="plate"><b>Фишинг</b><small>Фишинг аңшысы</small></div>
          <div class="cta"></div>
        </div>
      </div>

      <!-- Уровень 2 — Жеке деректер -->
      <div class="loc loc-2" data-i="1" role="button" tabindex="0">
        <div class="loc-in">
          <div class="loc-glow"></div>
          <div class="loc-bg"></div>
          <svg class="loc-art" viewBox="0 0 210 196" aria-hidden="true">
            <circle cx="105" cy="72" r="66" fill="#A8F4FF" opacity=".3"/>
            <g fill="#2C5BE0" stroke="#18213D" stroke-width="4" stroke-linejoin="round">

            <use href="#s-shield" x="174" y="0" width="26" height="31" style="color:#48AEFF"/>
            <use class="float-b" href="#s-crystal" x="176" y="34" width="28" height="40" style="color:#A8F4FF"/>
            <use class="float-a" href="#s-card" x="160" y="78" width="44" height="30" style="color:#FFD84A"/>
          </svg>
          <div class="sparks"></div>
          <div class="lock-big"><svg viewBox="0 0 50 60"><use href="#s-lock"/></svg></div>
          <div class="prize"><svg viewBox="0 0 64 52"><use href="#s-chest" style="color:#FFD84A"/></svg></div>
          <div class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-11" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="num">2</div>
          <div class="stars"></div>
          <div class="plate"><b>Жеке деректер</b><small>Деректер қорғаушысы</small></div>
          <div class="cta"></div>
        </div>
      </div>

      <!-- Уровень 3 — Желі жүргісі -->
      <div class="loc loc-3" data-i="2" role="button" tabindex="0">
        <div class="loc-in">
          <div class="loc-glow"></div>
          <div class="loc-bg"></div>
          <svg class="loc-art" viewBox="0 0 210 196" aria-hidden="true">
            <defs>
              <path id="cb1" d="M-8 92C28 56 62 128 104 86S178 54 218 90"/>
              <path id="cb2" d="M-8 36C34 14 66 62 108 44S182 18 218 50"/>
            </defs>
            <circle cx="105" cy="62" r="72" fill="#9B6BFF" opacity=".25"/>
            <g fill="none" stroke-linecap="round">
              <use href="#cb2" stroke="#18213D" stroke-width="11"/><use href="#cb2" stroke="#7648E8" stroke-width="6"/><use class="cab" href="#cb2" stroke="#7BE9FF" stroke-width="2.5"/>
              <use href="#cb1" stroke="#18213D" stroke-width="13"/><use href="#cb1" stroke="#9B6BFF" stroke-width="7"/><use class="cab c2" href="#cb1" stroke="#FF8AF0" stroke-width="2.5"/>
            </g>
            <use href="#s-tower" x="76" y="-12" width="58" height="106" style="color:#C9A6FF"/>
            <circle class="orb" cx="34" cy="76" r="6"/><circle class="orb o2" cx="176" cy="66" r="6"/><circle class="orb o3" cx="104" cy="86" r="5"/>
            <circle cx="168" cy="92" r="26" fill="#FFD84A" opacity=".28"/>
            <use href="#s-chest" x="148" y="76" width="42" height="34" style="color:#FFD84A"/>
            <use class="zap" href="#s-bolt" x="14" y="2" width="22" height="37" style="color:#FFF08A"/>
            <use class="zap d2" href="#s-bolt" x="176" y="4" width="20" height="33" style="color:#7BE9FF"/>
          </svg>
          <div class="sparks"></div>
          <div class="lock-big"><svg viewBox="0 0 50 60"><use href="#s-lock"/></svg></div>
          <div class="prize"><svg viewBox="0 0 64 52"><use href="#s-chest" style="color:#FFD84A"/></svg></div>
          <div class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-11" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="num">3</div>
          <div class="stars"></div>
          <div class="plate"><b>Желі жүргісі</b><small>Желі шебері</small></div>
          <div class="cta"></div>
        </div>
      </div>

      <!-- Уровень 4 — Алаяқпен шайқас -->
      <div class="loc loc-4" data-i="3" role="button" tabindex="0">
        <div class="loc-in">
          <div class="loc-glow"></div>
          <div class="loc-bg"></div>
          <svg class="loc-art" viewBox="0 0 210 196" aria-hidden="true">
            <circle cx="150" cy="40" r="56" fill="#FFD84A" opacity=".32"/>
            <use href="#s-trophy" x="108" y="-18" width="92" height="98" style="color:#FFD84A"/>

            <use class="zap d2" href="#s-bolt" x="6" y="18" width="22" height="37" style="color:#FFF08A"/>

              <path d="M52 44q22-26 44 0" fill="none" stroke="#5B3FC4" stroke-width="4" stroke-linecap="round"/>

              <polygon points="58,58 70,63 67,68 57,63" fill="#FFE94A"/>
              <polygon points="90,58 78,63 81,68 91,63" fill="#FFE94A"/>
              <path d="M60 72q14 12 28 0z" fill="#fff" stroke="#18213D" stroke-width="2.5" stroke-linejoin="round"/>
              <path d="M67 73v5M74 75v5M81 73v5" stroke="#18213D" stroke-width="2" stroke-linecap="round"/>
            </g>
            <use class="float-a" href="#s-shield" x="150" y="74" width="28" height="34" style="color:#48AEFF"/>
            <use href="#s-shield" x="4" y="76" width="26" height="31" style="color:#31D7D3"/>
            <path d="M8 114l9.7-16 9.7 16 9.7-16 9.7 16 9.7-16 9.7 16 9.7-16 9.7 16 9.7-16 9.7 16 9.7-16 9.7 16 9.7-16 9.7 16 9.7-16 9.7 16 9.7-16 9.7 16 9.7-16 9.7 16z" fill="#FFD84A" stroke="#18213D" stroke-width="3" stroke-linejoin="round"/>
          </svg>
          <div class="sparks"></div>
          <div class="lock-big"><svg viewBox="0 0 50 60"><use href="#s-lock"/></svg></div>
          <div class="prize"><svg viewBox="0 0 60 64"><use href="#s-trophy" style="color:#FFD84A"/></svg></div>
          <div class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-11" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="num">4</div>
          <div class="stars"></div>
          <div class="plate"><b>Алаяқпен шайқас</b><small>Қалқан қорғаушысы</small></div>
          <div class="cta"></div>
        </div>
      </div>

      <!-- Герой -->
      <div class="hero" id="hero" aria-hidden="true">
        <svg class="hero-svg" viewBox="0 0 120 160" width="108" height="144">
          <ellipse class="h-shadow" cx="60" cy="152" rx="30" ry="6" fill="rgba(8,6,36,.38)"/>
          <g class="h-flip">
            <g class="h-bob">
              <g class="h-pack">
                <rect x="20" y="64" width="32" height="46" rx="13" fill="#FF9B3D" stroke="#18213D" stroke-width="4"/>
                <rect x="25" y="82" width="22" height="16" rx="6" fill="#FFD84A" stroke="#18213D" stroke-width="3"/>
              </g>
              <rect x="42" y="108" width="16" height="34" rx="8" fill="#3D2F9F" stroke="#18213D" stroke-width="4"/>
              <rect x="62" y="108" width="16" height="34" rx="8" fill="#3D2F9F" stroke="#18213D" stroke-width="4"/>
              <ellipse cx="48" cy="145" rx="13" ry="7" fill="#fff" stroke="#18213D" stroke-width="4"/>
              <ellipse cx="73" cy="145" rx="13" ry="7" fill="#fff" stroke="#18213D" stroke-width="4"/>
              <path d="M34 74Q60 62 86 74L90 116Q60 128 30 116Z" fill="#31D7D3" stroke="#18213D" stroke-width="4" stroke-linejoin="round"/>
              <rect x="46" y="101" width="28" height="13" rx="6" fill="#1FB8B4" stroke="#18213D" stroke-width="3"/>
              <use href="#s-shield" x="49" y="79" width="22" height="26" style="color:#FFD84A"/>
              <g class="h-wave">
                <path d="M84 80L104 98" stroke="#18213D" stroke-width="17" stroke-linecap="round"/>
                <path d="M84 80L104 98" stroke="#31D7D3" stroke-width="9" stroke-linecap="round"/>
                <circle cx="106" cy="100" r="8" fill="#FFCBA4" stroke="#18213D" stroke-width="3.5"/>
              </g>
              <path d="M38 82L24 102" stroke="#18213D" stroke-width="17" stroke-linecap="round"/>
              <path d="M38 82L24 102" stroke="#31D7D3" stroke-width="9" stroke-linecap="round"/>
              <use href="#s-shield" x="4" y="90" width="36" height="43" style="color:#48AEFF"/>
              <circle cx="26" cy="104" r="7" fill="#FFCBA4" stroke="#18213D" stroke-width="3.5"/>
              <g id="headSlot"></g>
            </g>
          </g>
        </svg>
      </div>

      <svg class="near-city" id="nearCity" aria-hidden="true"></svg>
    </div>
  </main>

  <!-- ============ HUD ============ -->
  <header class="hud">
    <div class="hud-top">
      <div class="avatar-wrap">
        <div class="avatar"><svg id="avatarSvg" viewBox="18 0 84 78"></svg><i class="online"></i></div>
        <span class="avatar-name">Айдос</span>
      </div>

      <div class="logo" aria-label="Қауіпсіз цифрлық әлем">
        <svg viewBox="0 0 250 92" class="logo-svg" role="img">
          <defs>
            <linearGradient id="gLogo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#BDEBFF"/></linearGradient>
            <text id="lt1" x="52" y="46" font-size="42" textLength="186" lengthAdjust="spacingAndGlyphs">Қауіпсіз</text>
            <text id="lt2" x="14" y="80" font-size="29" textLength="222" lengthAdjust="spacingAndGlyphs">цифрлық әлем</text>
          </defs>
          <use href="#s-shield" x="4" y="8" width="42" height="50" style="color:#31D7D3"/>
          <path d="M26 20l-7 12h8l-3 12 11-16h-8l4-8z" fill="#FFD84A" stroke="#18213D" stroke-width="2.5" stroke-linejoin="round"/>
          <g class="logo-text" font-weight="900" stroke-linejoin="round">
            <use href="#lt1" transform="translate(0 5)" fill="#0C1236" stroke="#0C1236" stroke-width="15"/>
            <use href="#lt1" fill="#3D2F9F" stroke="#3D2F9F" stroke-width="10"/>
            <use href="#lt1" fill="url(#gLogo)"/>
            <use href="#lt2" transform="translate(0 5)" fill="#0C1236" stroke="#0C1236" stroke-width="13"/>
            <use href="#lt2" fill="#7648E8" stroke="#7648E8" stroke-width="9"/>
            <use href="#lt2" fill="#FFF3A6"/>
          </g>
          <g transform="translate(240 12)"><path class="lg-spark" d="M0-9 2.4-2.4 9 0 2.4 2.4 0 9-2.4 2.4-9 0-2.4-2.4z" fill="#FFD84A"/></g>
          <g transform="translate(236 70)"><path class="lg-spark s2" d="M0-7 2-2 7 0 2 2 0 7-2 2-7 0-2-2z" fill="#7BE9FF"/></g>
          <g transform="translate(8 74)"><path class="lg-spark s3" d="M0-6 1.7-1.7 6 0 1.7 1.7 0 6-1.7 1.7-6 0-1.7-1.7z" fill="#fff"/></g>
        </svg>
      </div>

      <button class="gear" id="gearBtn" type="button" aria-label="Баптаулар">
        <svg viewBox="0 0 44 44"><use href="#s-gear"/></svg>
      </button>
    </div>

    <div class="tag">Қаланы бірге қорғайық!</div>

    <div class="prog">
      <div class="medal"><svg viewBox="0 0 56 72"><use href="#s-medal"/></svg><i class="glint"></i></div>
      <div class="prog-text" id="progText">Қорғаныс белгілері: 1 / 4</div>
      <div class="bar"><i id="progBar"></i></div>
    </div>
  </header>

  <!-- ============ ПОДСКАЗКА-ОБЛАЧКО ============ -->
  <div class="hint">
    <div class="hint-hero"><svg id="hintSvg" viewBox="18 0 84 78"></svg></div>
    <div class="hint-bubble">
      <svg class="hint-ic" viewBox="0 0 36 60"><use href="#s-phone" style="color:#31D7D3"/></svg>
      <span>Қауіп төнгенде <b class="n102">102</b> нөміріне хабарлас</span>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- ============ ДИАЛОГИ ============ -->
  <div class="overlay" id="missionWrap">
    <div class="scrim" data-close></div>
    <section class="sheet mission" id="missionSheet" role="dialog" aria-modal="true"></section>
  </div>

  <div class="overlay" id="settingsWrap">
    <div class="scrim" data-close></div>
    <section class="sheet settings" role="dialog" aria-modal="true" aria-label="Баптаулар">
      <h2 class="s-title">Баптаулар</h2>
      <div class="s-row">
        <span>Дыбыс</span>
        <div class="switch" id="sndSwitch" role="switch" tabindex="0" aria-checked="true"><i></i></div>
      </div>
      <button class="big-btn danger" id="resetBtn" type="button">Прогресті қалпына келтіру</button>
      <button class="big-btn alt" type="button" data-close>Жабу</button>
    </section>
  </div>

  <div class="overlay center" id="resultWrap">
    <div class="scrim"></div>
    <section class="sheet result" id="resultSheet" role="dialog" aria-modal="true"></section>
  </div>

  <div id="fx" aria-hidden="true"></div>
</div>

<script src="script.js"></script>
</body>
</html>
